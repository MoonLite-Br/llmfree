[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llmf"
dynamic = ["version"]
description = "llmf (llmfree): free, keyless LLM chat with automatic multi-provider fallback — stdlib only."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Html", email = "moonlite-br@users.noreply.github.com" }]
keywords = ["llm", "ai", "chat", "free", "keyless", "openai-compatible", "fallback", "termux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MoonLite-Br/llmfree"
Documentation = "https://github.com/MoonLite-Br/llmfree#readme"
Repository = "https://github.com/MoonLite-Br/llmfree"
Issues = "https://github.com/MoonLite-Br/llmfree/issues"
Changelog = "https://github.com/MoonLite-Br/llmfree/blob/main/CHANGELOG.md"
PyPI = "https://pypi.org/project/llmf/"

[project.scripts]
llmf = "llmf.cli:main"

[tool.setuptools.dynamic]
version = { attr = "llmf._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmf = ["py.typed"]
