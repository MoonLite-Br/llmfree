name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Import check
        run: python -c "import llmf, llmf.server, llmf.cli"
        env:
          PYTHONPATH: src
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Wheel contains the web chat assets
        run: python -m zipfile -l dist/*.whl | grep -E "llmf/web/(chat.html|client.js|ui.js)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
