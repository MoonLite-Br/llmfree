name: Publish to PyPI
# Trusted Publishing (no token). On PyPI the project `llmf` needs one publisher:
#   owner MoonLite-Br, repo llmfree, workflow publish.yml, environment pypi
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
