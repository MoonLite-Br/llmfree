<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI chat</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1c1e21;--mut:#6b7280;--card:#f3f4f6;--me:#2563eb;--bd:#d1d5db}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--fg:#e5e7eb;--mut:#9ca3af;--card:#1c1f26;--bd:#2d323b}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd)}
header h1{font-size:1.05rem;margin:0;flex:1}
#clear{background:none;border:1px solid var(--bd);color:var(--mut);border-radius:8px;padding:4px 10px;cursor:pointer}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:10px 14px;border-radius:14px;background:var(--card)}
.m.user{align-self:flex-end;background:var(--me);color:#fff}
.m b{display:block;font-size:.72rem;opacity:.7;margin-bottom:2px}
.m .t{white-space:pre-wrap;overflow-wrap:anywhere}
.m.bad{border:1px solid #dc2626}
.empty{color:var(--mut);text-align:center;margin:auto}
#status{min-height:1.2em;padding:0 16px;color:var(--mut);font-size:.85rem}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--bd)}
textarea{flex:1;resize:none;height:48px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit}
#send{padding:0 18px;border:0;border-radius:10px;background:var(--me);color:#fff;font:inherit;cursor:pointer}
</style></head>
<body>
<header><h1 id="title">AI chat</h1><button id="clear" type="button">Clear</button></header>
<div id="log" aria-live="polite"></div>
<div id="status"></div>
<form id="form"><textarea id="box" rows="1" autofocus></textarea><button id="send" type="submit">Send</button></form>
<script src="/_llmf/client.js"></script>
<script src="/_llmf/ui.js"></script>
</body></html>
