name: Publish to PyPI
# Uses PyPI "Trusted Publishing" (no token needed): on PyPI add a pending publisher
# for this repo, workflow "publish.yml", environment "pypi".
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
